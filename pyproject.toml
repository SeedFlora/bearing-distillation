[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmkd-bearing"
version = "0.1.0"
description = "Transferability-aware cross-modal distillation for current-only bearing fault diagnosis (research code)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT (code only; datasets keep their own licences)" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
